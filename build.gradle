allprojects {
    group = 'com.clipsoft'
    version = '2.0.0'

    repositories {
        mavenCentral()
    }
}

subprojects {
    if (project.name != 'bom') {
        apply plugin: 'java'

        java {
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }

        // @req FR-TEST-003 — default `test` task runs unit tests only (excludes `@Tag("integration")`).
        tasks.named('test', Test) {
            useJUnitPlatform {
                excludeTags 'integration'
            }
        }

        dependencies {
            testImplementation "org.junit.jupiter:junit-jupiter-api:${junitVersion}"
            testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${junitVersion}"
            testImplementation "org.mockito:mockito-core:${mockitoVersion}"
            testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
        }

        // @req FR-TEST-003 — dedicated `integrationTest` task runs only `@Tag("integration")` tests
        // against the module's Tomcat embed classpath. Decoupled from `check` so default builds stay fast.
        tasks.register('integrationTest', Test) {
            group = 'verification'
            description = 'Runs @Tag("integration") tests (Tomcat embed) for this module.'
            useJUnitPlatform {
                includeTags 'integration'
            }
            testClassesDirs = sourceSets.test.output.classesDirs
            classpath = sourceSets.test.runtimeClasspath
            shouldRunAfter tasks.named('test')
        }
    }
}

// CON-MOD-001: version modules MUST NOT depend on each other.
// validateNoVersionModuleCrossDeps fails the build when any servletN module pulls
// another servletN module via a project(...) dependency.
def versionModuleCrossDepBanlist = [
    servlet5 : ['servlet6', 'servlet61'],
    servlet6 : ['servlet5', 'servlet61'],
    servlet61: ['servlet5', 'servlet6']
]

tasks.register('validateNoVersionModuleCrossDeps') {
    group = 'verification'
    description = 'Fails the build if any servletN module depends on another servletN module.'
    doLast {
        def violations = []
        versionModuleCrossDepBanlist.each { srcModule, bannedModules ->
            def srcProject = rootProject.findProject(":${srcModule}")
            if (srcProject == null) {
                return
            }
            srcProject.configurations.compileClasspath.allDependencies.each { dep ->
                if (dep instanceof ProjectDependency) {
                    def targetName = dep.dependencyProject.name
                    if (bannedModules.contains(targetName)) {
                        violations << "${srcModule} -> ${targetName} (forbidden cross-version dependency)"
                    }
                }
            }
        }
        if (!violations.isEmpty()) {
            throw new GradleException(
                "CON-MOD-001 violation: forbidden cross-version module dependencies detected:\n  "
                    + violations.join("\n  ")
            )
        }
        logger.lifecycle("validateNoVersionModuleCrossDeps: PASS (0 violations across servlet5/servlet6/servlet61)")
    }
}

subprojects {
    if (project.name != 'bom') {
        afterEvaluate {
            def checkTask = tasks.findByName('check')
            if (checkTask != null) {
                checkTask.dependsOn(rootProject.tasks.named('validateNoVersionModuleCrossDeps'))
            }
        }
    }
}
